name: Build Samsung APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Reuse the same local debug signature for future demo builds when cached.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vivascapes-demo-signing-v1
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VivaScapes-Samsung-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
